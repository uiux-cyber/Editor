name: Release

# Push a version tag (for example v1.2.0) to build the Windows installer and publish it as a
# GitHub release. Installed copies of Kinora find it within a few hours and update themselves.
# Running the workflow by hand builds everything without publishing (a dry run).
# See docs/RELEASING.md.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($version)."
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Download the bundled AI models
        run: npm run models

      - name: Build the installer
        run: npm run dist -- --publish never

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          # latest.yml is what installed copies read to find the update; the blockmap lets them
          # download only the parts of the installer that changed.
          gh release create "$GITHUB_REF_NAME" \
            "release/Kinora-Setup-${version}.exe" \
            "release/Kinora-Setup-${version}.exe.blockmap" \
            release/latest.yml \
            --title "Kinora ${version}" --verify-tag "${notes_args[@]}"

      - name: Keep the build (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: kinora-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 7
